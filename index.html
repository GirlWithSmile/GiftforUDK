<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏍️ Prekvapenie ❤️</title>

<style>
body{
    margin:0;
    overflow:hidden;
    height:100vh;
    background:linear-gradient(to top,#ffb6c1,#ffd6e7,#fff);
    font-family:Arial,sans-serif;
}

.road{
    position:absolute;
    bottom:100px;
    width:100%;
    height:120px;
    background:#444;
}

.line{
    position:absolute;
    top:55px;
    width:100%;
    height:10px;
    background:repeating-linear-gradient(
        to right,
        white 0px,
        white 40px,
        transparent 40px,
        transparent 80px
    );
}

.bike{
    position:absolute;
    font-size:60px;
    bottom:135px;
}

#girl{
    left:-100px;
}

#boy{
    left:-200px;
}

.message{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    opacity:0;
    transition:2s;
}

.message h1{
    color:#d6336c;
    font-size:42px;
}

.message p{
    font-size:28px;
    color:#444;
}

.show{
    opacity:1;
}

.heart{
    position:absolute;
    font-size:25px;
    animation:float 5s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(0);
        opacity:1;
    }
    to{
        transform:translateY(-250px);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="road">
    <div class="line"></div>
</div>

<div id="girl" class="bike">🏍️👩</div>
<div id="boy" class="bike">🏍️👨</div>

<div id="msg" class="message">
    <h1>❤️ Som za teba rada ❤️</h1>
    <p>Usmej sa pre mňa 😊</p>
</div>

<script>

const girl = document.getElementById("girl");
const boy = document.getElementById("boy");
const msg = document.getElementById("msg");

let girlPos = -100;
let boyPos = -250;

let stage = 1;

const race = setInterval(() => {

    if(stage === 1){
        girlPos += 4;
        girl.style.left = girlPos + "px";

        if(girlPos > 250){
            stage = 2;
        }
    }

    else if(stage === 2){
        girlPos += 3;
        boyPos += 6;

        girl.style.left = girlPos + "px";
        boy.style.left = boyPos + "px";

        if(boyPos >= girlPos - 20){
            stage = 3;
        }
    }

    else if(stage === 3){
        girlPos += 4;
        boyPos += 4;

        girl.style.left = girlPos + "px";
        boy.style.left = boyPos + "px";

        if(girlPos > window.innerWidth - 350){
            clearInterval(race);

            msg.classList.add("show");

            for(let i=0;i<30;i++){
                const heart=document.createElement("div");
                heart.className="heart";
                heart.innerHTML="❤️";
                heart.style.left=(40+Math.random()*20)+"%";
                heart.style.top="60%";
                heart.style.animationDelay=Math.random()*2+"s";
                document.body.appendChild(heart);
            }
        }
    }

},30);

</script>

</body>
</html>
